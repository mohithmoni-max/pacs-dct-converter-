name: Build DCT Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libltdl-dev libssl-dev automake autopoint gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buildozer
        run: python -m pip install --upgrade pip setuptools wheel "Cython<4" buildozer==1.6.0

      - name: Prepare Android dependency source
        run: |
          P4A_DIR="android/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git "$P4A_DIR"
          sed -i 's|https://tukaani.org/xz/xz-{version}.tar.gz|https://github.com/tukaani-project/xz/archive/refs/tags/v{version}.tar.gz|' "$P4A_DIR/pythonforandroid/recipes/liblzma/__init__.py"
          sed -i 's/"numpy>=2.0"/"numpy==2.2.0"/' "$P4A_DIR/pythonforandroid/recipes/pandas/__init__.py"

      - name: Build debug APK
        working-directory: android
        run: buildozer android debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dct-mobile-validator-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30
